 <path d="M51 208L147 239L239 206L144 176Z" fill="#F5F7FB" stroke="#D2D8E2"/>
 <path d="M68 207L146 231L215 207L139 183Z" fill="#B4BFCD" opacity=".62"/>
 <path d="M103 219L156 235L170 230L119 214Z" fill="#E7EBF2"/>
