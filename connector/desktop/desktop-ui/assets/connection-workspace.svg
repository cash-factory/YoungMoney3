 <g opacity=".9"><circle cx="224" cy="189" r="3.6" fill="#D7193D"/><circle cx="355" cy="186" r="3.2" fill="#D7193D"/><circle cx="421" cy="169" r="3.2" fill="#D7193D"/></g>
