<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 278" role="img" aria-label="Laptop connected to isolated trading account servers">
<defs>
 <linearGradient id="laptopScreen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFCFF"/><stop offset="1" stop-color="#DFE4EF"/></linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#BFC6D4"/></linearGradient>
 <linearGradient id="server" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".72" stop-color="#E5E9F2"/><stop offset="1" stop-color="#BAC4D2"/></linearGradient>
 <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8E9AAF"/><stop offset="1" stop-color="#424B5A"/></linearGradient>
 <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F7A5AF"/><stop offset=".45" stop-color="#E11E3F"/><stop offset="1" stop-color="#C60C2B"/></linearGradient>
 <filter id="shadow" x="-35%" y="-50%" width="175%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="halo" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
 </defs>
 <!-- quiet workspace shadows -->
 <ellipse cx="148" cy="242" rx="115" ry="20" fill="#9AA5B5" opacity=".13" filter="url(#shadow)"/>
 <ellipse cx="463" cy="228" rx="101" ry="18" fill="#97A2B4" opacity=".17" filter="url(#shadow)"/>
 <path d="M210 191C286 173 318 206 368 181C390 171 405 157 428 169" fill="none" stroke="#D8B9C0" opacity=".5" stroke-width="8" stroke-linecap="round"/>
 <path class="signal-track" d="M210 191C286 173 318 206 368 181C390 171 405 157 428 169" fill="none" stroke="url(#cable)" stroke-width="3.2" stroke-linecap="round"/>
 <path class="signal-scan" d="M210 191C286 173 318 206 368 181C390 171 405 157 428 169" fill="none" stroke="#FFF8F9" stroke-width="3.5" stroke-dasharray="2 35" stroke-linecap="round"/>
 <circle class="signal-dot" r="4" fill="#D51634"><animateMotion dur="4s" repeatCount="indefinite" path="M210 191C286 173 318 206 368 181C390 171 405 157 428 169"/></circle>
 <!-- laptop shadow and base -->
 <path d="M41 214L142 252L249 214L149 180Z" fill="#ACB4C0" opacity=".3" filter="url(#shadow)"/>
