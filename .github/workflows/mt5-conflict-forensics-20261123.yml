name: One-off staging MT5 conflict root-cause aggregate
on:
  push:
    branches: [fix/mt5-reconnect-recovery-20261123]
    paths: [.github/workflows/mt5-conflict-forensics-20261123.yml]
permissions:
  contents: read
jobs:
  summarize:
    if: github.repository == 'cash-factory/YoungMoney3'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 12
    env:
      YM3_STAGING_D1_ID: ${{ vars.YM3_STAGING_D1_ID }}
      YM3_STAGING_D1_NAME: ${{ vars.YM3_STAGING_D1_NAME }}
      YM3_STAGING_WORKER_NAME: ${{ vars.YM3_STAGING_WORKER_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read-only staging counts, no user IDs, broker IDs or raw payloads
        run: |
          set -euo pipefail
          npm ci
          npm run cf:staging:prepare
          node scripts/verify-mt5-conflict-schema.mjs
          node scripts/inspect-mt5-conflicts-summary.mjs
