name: One-off staging login hotfix validation and deployment
on:
  push:
    branches: [fix/cloudflare-password-hash-compat-20261123]
    paths: [.github/workflows/staging-login-hotfix-20261123.yml]
permissions:
  contents: read
concurrency:
  group: youngmoney3-staging-release
  cancel-in-progress: false
jobs:
  staging-login-hotfix:
    if: github.repository == 'cash-factory/YoungMoney3'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      YM3_STAGING_D1_ID: ${{ vars.YM3_STAGING_D1_ID }}
      YM3_STAGING_D1_NAME: ${{ vars.YM3_STAGING_D1_NAME }}
      YM3_STAGING_WORKER_NAME: ${{ vars.YM3_STAGING_WORKER_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout proposed hotfix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unexpected branch, baseline or unrelated code changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/cloudflare-password-hash-compat-20261123'
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = '17bdb47afb76db41c1166d064b517cff2a812019'
          test "$(git merge-base origin/main HEAD)" = '17bdb47afb76db41c1166d064b517cff2a812019'
          while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json|worker/passwords.ts|worker/index.ts|scripts/test-passwords.mjs|.github/workflows/staging-login-hotfix-20261123.yml) ;;
              *) echo "Unapproved hotfix path: $path"; exit 1;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate hotfix and full server contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run test:staging
          node --test scripts/test-owner-recovery.mjs
          npm run test:ui
          npm run test:worker
          npm run build
      - name: Assert staging-only Cloudflare resources and schema
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "${YM3_STAGING_WORKER_NAME:-}" = 'ym-fx-staging'
          npm run cf:staging:prepare
          npm run cf:staging:verify
          node scripts/verify-rich-staging-schema.mjs
      - name: Deploy only the separate ym-fx-staging Worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = '17bdb47afb76db41c1166d064b517cff2a812019'
          npx wrangler deploy --config wrangler.staging.jsonc | tee "$RUNNER_TEMP/ym3-login-hotfix.log"
      - name: Verify staging health and safe anonymous auth response
        shell: bash
        env:
          YM3_STAGING_URL: https://ym-fx-staging.ethical-hacker263.workers.dev
        run: |
          set -euo pipefail
          grep -F "$YM3_STAGING_URL" "$RUNNER_TEMP/ym3-login-hotfix.log"
          node scripts/check-staging-health.mjs
          node --input-type=module -e '
            const base=process.env.YM3_STAGING_URL;
            const r=await fetch(base+"/api/auth/signin",{
              method:"POST",headers:{"content-type":"application/json"},
              body:JSON.stringify({email:"not-an-account-"+Date.now()+"@example.invalid",password:"invalid"}),
              signal:AbortSignal.timeout(15000)
            });
            const body=await r.json();
            if(r.status!==401 || body.error!=="Invalid email or password.")
              throw Error("Staging auth service did not return the expected safe 401");
            console.log("Unauthenticated staging sign-in correctly returns 401.");
          '
      - name: Deployment evidence and limits
        if: always()
        shell: bash
        run: |
          echo "Staging-only login hotfix SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No production Worker, production D1, or staging D1 migrations are targeted." >> "$GITHUB_STEP_SUMMARY"
          echo "A real member sign-in, PBKDF2 CPU time and Cloudflare runtime logs still require operator verification." >> "$GITHUB_STEP_SUMMARY"
