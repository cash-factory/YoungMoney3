name: Deploy staging from validated main
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-STAGING-ONLY to migrate and deploy the separate staging environment"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: youngmoney3-staging-release
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirmation == 'DEPLOY-STAGING-ONLY')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      YM3_STAGING_D1_ID: ${{ vars.YM3_STAGING_D1_ID }}
      YM3_STAGING_D1_NAME: ${{ vars.YM3_STAGING_D1_NAME }}
      YM3_STAGING_WORKER_NAME: ${{ vars.YM3_STAGING_WORKER_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Prevent stale commits from overwriting newer staging
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$(git rev-parse HEAD)" || {
            echo "A newer main commit exists; refusing a stale staging deployment."
            exit 1
          }
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject missing Cloudflare access and production resources
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure a staging-only CLOUDFLARE_API_TOKEN environment secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure CLOUDFLARE_ACCOUNT_ID in staging environment secrets"; exit 1; }
          test "${YM3_STAGING_WORKER_NAME:-ym-fx-staging}" = 'ym-fx-staging' || { echo "Refusing deployment to an unexpected staging Worker"; exit 1; }
          npm run cf:staging:prepare
      - name: Validate source before touching staging
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:staging
          node --test scripts/test-owner-recovery.mjs
          npm run test:ui
          npm run test:worker
          npm run build
      - name: Review staged migration list
        run: npx wrangler d1 migrations list DB --remote --config wrangler.staging.jsonc
      - name: Apply migrations to staging D1 only
        run: npm run cf:staging:migrate
      - name: Require MT5, admin and rich-capture schema readiness
        run: |
          npm run cf:staging:verify
          node scripts/verify-rich-staging-schema.mjs
      - name: Deploy staging Worker and frontend only
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)"
          test "$CURRENT" = "$(git rev-parse HEAD)" || { echo "Refusing to deploy a stale main commit."; exit 1; }
          npx wrangler deploy --config wrangler.staging.jsonc | tee "$RUNNER_TEMP/ym3-staging-deploy.log"
      - name: Verify public API health and browser navigation
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_URL="$(grep -Eo 'https://[a-zA-Z0-9-]+[.][a-zA-Z0-9-]+[.]workers[.]dev' "$RUNNER_TEMP/ym3-staging-deploy.log" | tail -n 1 || true)"
          if [[ "$DEPLOYED_URL" != 'https://ym-fx-staging.ethical-hacker263.workers.dev' ]]; then
            echo "Deployment URL does not match the designated staging Worker: $DEPLOYED_URL"
            exit 1
          fi
          if [[ -z "$DEPLOYED_URL" ]]; then
            echo "Wrangler did not print a staging workers.dev URL; cannot verify deployed API."
            exit 1
          fi
          YM3_STAGING_URL="$DEPLOYED_URL" node scripts/check-staging-health.mjs
      - name: Verify optional public homepage study
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f public/home-lab/index.html ]]; then
            URL="https://ym-fx-staging.ethical-hacker263.workers.dev/home-lab"
            curl --fail --silent --show-error --retry 3 "$URL/" -o "$RUNNER_TEMP/home-lab-index.html"
            curl --fail --silent --show-error --retry 3 "$URL/lab.js" -o "$RUNNER_TEMP/home-lab.js"
            curl --fail --silent --show-error --retry 3 "$URL/lab.css" -o "$RUNNER_TEMP/home-lab.css"
            grep -q 'Home Page Design Lab' "$RUNNER_TEMP/home-lab-index.html"
            grep -q 'YM-FX Home Lab' "$RUNNER_TEMP/home-lab.js"
            grep -q 'YM/FX HOME LAB' "$RUNNER_TEMP/home-lab.css"
            echo "Public design lab and both assets are reachable from the staging URL."
          fi
      - name: Release evidence
        shell: bash
        run: |
          echo "### Staging source deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "D1 migrations 0006–0008: verified in staging before Worker deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "Production database and Worker were NOT targeted." >> "$GITHUB_STEP_SUMMARY"
          echo "Browser smoke tests, private media, recovery drills, and actual MT5 reconciliation remain separate operator acceptance checks." >> "$GITHUB_STEP_SUMMARY"
