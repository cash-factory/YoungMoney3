name: Deploy staging (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-STAGING-ONLY to migrate and deploy the separate staging environment"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: youngmoney3-staging-release
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-STAGING-ONLY'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      YM3_STAGING_D1_ID: ${{ vars.YM3_STAGING_D1_ID }}
      YM3_STAGING_D1_NAME: ${{ vars.YM3_STAGING_D1_NAME }}
      YM3_STAGING_WORKER_NAME: ${{ vars.YM3_STAGING_WORKER_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout reviewed main branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject missing Cloudflare access and production resources
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure a staging-only CLOUDFLARE_API_TOKEN environment secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure CLOUDFLARE_ACCOUNT_ID in staging environment secrets"; exit 1; }
          npm run cf:staging:prepare
      - name: Validate source before touching staging
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:staging
          node --test scripts/test-owner-recovery.mjs
          npm run test:ui
          npm run test:worker
          npx vite build --mode staging
      - name: Review staged migration list
        run: npx wrangler d1 migrations list DB --remote --config wrangler.staging.jsonc
      - name: Apply migrations to staging D1 only
        run: npm run cf:staging:migrate
      - name: Require MT5 and admin schema readiness
        run: npm run cf:staging:verify
      - name: Deploy staging Worker and frontend only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.staging.jsonc | tee "$RUNNER_TEMP/ym3-staging-deploy.log"
      - name: Verify public API health and browser navigation
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_URL="$(grep -Eo 'https://[a-zA-Z0-9-]+[.][a-zA-Z0-9-]+[.]workers[.]dev' "$RUNNER_TEMP/ym3-staging-deploy.log" | tail -n 1 || true)"
          if [[ -z "$DEPLOYED_URL" ]]; then
            echo "Wrangler did not print a staging workers.dev URL; cannot verify deployed API."
            exit 1
          fi
          YM3_STAGING_URL="$DEPLOYED_URL" node scripts/check-staging-health.mjs
      - name: Release evidence
        shell: bash
        run: |
          echo "### Staging source deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "D1 migrations 0006–0008: verified in staging before Worker deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "Production database and Worker were NOT targeted." >> "$GITHUB_STEP_SUMMARY"
          echo "Browser smoke tests, private media, recovery drills, and actual MT5 reconciliation remain separate operator acceptance checks." >> "$GITHUB_STEP_SUMMARY"
