name: One-off staging portal download for verified v0.5.7 recovery connector
on:
  push:
    branches: [fix/mt5-reconnect-recovery-20261123]
    paths: [.github/workflows/staging-mt5-recovery-download-20261123.yml]
permissions:
  contents: read
concurrency:
  group: youngmoney3-staging-release
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'cash-factory/YoungMoney3'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YM3_STAGING_D1_ID: ${{ vars.YM3_STAGING_D1_ID }}
      YM3_STAGING_D1_NAME: ${{ vars.YM3_STAGING_D1_NAME }}
      YM3_STAGING_WORKER_NAME: ${{ vars.YM3_STAGING_WORKER_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse wrong branch, production resources, unverified release or unexpected source edits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/mt5-reconnect-recovery-20261123'
          test "${YM3_STAGING_WORKER_NAME:-}" = 'ym-fx-staging'
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = '17bdb47afb76db41c1166d064b517cff2a812019'
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/staging-mt5-recovery-connector-release-20261123.yml|.github/workflows/staging-mt5-recovery-download-20261123.yml|src/components/Mt5Connections.tsx|public/connector-download.html|scripts/test-ui-contract.mjs|scripts/test-connector-release-contract.py|connector/README.md) ;;
              *) echo "Unapproved post-staging path: $path"; exit 1;;
            esac
          done < <(git diff --name-only df157fc1b0ae4c4823dd1421833ab54045fb19c1...HEAD)
          release="$(gh api repos/$GITHUB_REPOSITORY/releases/tags/staging-connector-v0.5.7-rc1 --jq '.prerelease')"
          test "$release" = true
          digest="$(gh api repos/$GITHUB_REPOSITORY/releases/tags/staging-connector-v0.5.7-rc1 --jq '.assets[]|select(.name=="YoungMoney3.Connector.exe")|.digest')"
          test "$digest" = 'sha256:4fe6ca4278f608ebb876d327f1672e694fe7b916e854a2b21a276bd2f0d4e4fb'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check UI, account ownership, Worker and connector release contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run test:staging
          node --test scripts/test-owner-recovery.mjs
          npm run test:ui
          npm run test:worker
          python scripts/test-connector-release-contract.py
          npm run build
      - name: Verify isolated staging database; NO migrations on portal-only rollout
        shell: bash
        run: |
          set -euo pipefail
          npm run cf:staging:prepare
          npm run cf:staging:verify
          node scripts/verify-rich-staging-schema.mjs
          node scripts/verify-copy-staging-schema.mjs
          node scripts/verify-mt5-conflict-schema.mjs
          node scripts/verify-mt5-recovery-schema.mjs
      - name: Deploy only staging Worker and updated portal assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = '17bdb47afb76db41c1166d064b517cff2a812019'
          npx wrangler deploy --config wrangler.staging.jsonc --dry-run
          npx wrangler deploy --config wrangler.staging.jsonc | tee "$RUNNER_TEMP/recovery-download-stage.log"
          grep -F 'https://ym-fx-staging.ethical-hacker263.workers.dev' "$RUNNER_TEMP/recovery-download-stage.log"
      - name: Verify staging login and published download fallback with redirect following
        shell: bash
        env:
          YM3_STAGING_URL: https://ym-fx-staging.ethical-hacker263.workers.dev
        run: |
          set -euo pipefail
          node scripts/check-staging-health.mjs
          node scripts/probe-staging-login.mjs
          YM3_PROBE_LEGACY=1 node scripts/probe-staging-login.mjs
          curl --location --fail --silent --show-error --max-time 30 "$YM3_STAGING_URL/connector-download.html" | grep -F 'staging-connector-v0.5.7-rc1'
          curl --location --fail --silent --show-error --max-time 30 "$YM3_STAGING_URL/connector-download.html" | grep -F '4fe6ca4278f608ebb876d327f1672e694fe7b916e854a2b21a276bd2f0d4e4fb'
      - name: Boundaries
        if: always()
        shell: bash
        run: |
          echo "Staging-only v0.5.7 recovery connector release: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No production Worker, production D1, live trading permissions or MT5 order execution changed." >> "$GITHUB_STEP_SUMMARY"
          echo "No migrations run on this portal-only download update." >> "$GITHUB_STEP_SUMMARY"
