name: One-off staging MT5 immutable evidence conflict recovery
on:
  push:
    branches: [fix/mt5-evidence-conflict-quarantine-20261123]
    paths: [.github/workflows/staging-mt5-conflict-recovery-20261123.yml]
permissions:
  contents: read
concurrency:
  group: youngmoney3-staging-release
  cancel-in-progress: false
jobs:
  staging-recovery:
    if: github.repository == 'cash-factory/YoungMoney3'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    env:
      YM3_STAGING_D1_ID: ${{ vars.YM3_STAGING_D1_ID }}
      YM3_STAGING_D1_NAME: ${{ vars.YM3_STAGING_D1_NAME }}
      YM3_STAGING_WORKER_NAME: ${{ vars.YM3_STAGING_WORKER_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block unexpected source changes, production resources and wrong staging baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/mt5-evidence-conflict-quarantine-20261123'
          test "${YM3_STAGING_WORKER_NAME:-}" = 'ym-fx-staging'
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = '17bdb47afb76db41c1166d064b517cff2a812019'
          test "$(git merge-base origin/fix/mt5-http-capture-diagnostics-20261123 HEAD)" = 'a02207429cd0b91385b85a4ee78cb614103e924e'
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/staging-mt5-conflict-recovery-20261123.yml|migrations/0018_mt5_evidence_conflict_quarantine.sql|scripts/test-worker.mjs|scripts/verify-mt5-conflict-schema.mjs|scripts/probe-staging-mt5-conflict.mjs|worker/mt5.ts|src/components/EvidenceConflictPanel.tsx|src/components/Mt5Connections.tsx|src/lib/mt5Monitor.ts|src/connection-hub.css) ;;
              *) echo "Unapproved staging conflict recovery path: $path"; exit 1;;
            esac
          done < <(git diff --name-only origin/fix/mt5-http-capture-diagnostics-20261123...HEAD)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run complete Worker, account-owner, UI and staging contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run test:staging
          node --test scripts/test-owner-recovery.mjs
          npm run test:ui
          npm run test:worker
          npm run build
      - name: Confirm separate staging D1 and all previously applied migrations
        shell: bash
        run: |
          set -euo pipefail
          npm run cf:staging:prepare
          npm run cf:staging:verify
          node scripts/verify-rich-staging-schema.mjs
          node scripts/verify-copy-staging-schema.mjs
          npx wrangler d1 migrations list DB --remote --config wrangler.staging.jsonc
      - name: Apply additive conflict quarantine only to staging D1
        shell: bash
        run: |
          set -euo pipefail
          npm run cf:staging:migrate
          node scripts/verify-mt5-conflict-schema.mjs
          node scripts/verify-rich-staging-schema.mjs
          node scripts/verify-copy-staging-schema.mjs
          npm run cf:staging:verify
      - name: Deploy separate staging Worker with immutable-conflict review API
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = '17bdb47afb76db41c1166d064b517cff2a812019'
          npx wrangler deploy --config wrangler.staging.jsonc --dry-run
          npx wrangler deploy --config wrangler.staging.jsonc | tee "$RUNNER_TEMP/mt5-conflict-recovery.log"
          grep -F 'https://ym-fx-staging.ethical-hacker263.workers.dev' "$RUNNER_TEMP/mt5-conflict-recovery.log"
      - name: Verify deployed authentication and real staging conflict capture atomically
        shell: bash
        env:
          YM3_STAGING_URL: https://ym-fx-staging.ethical-hacker263.workers.dev
        run: |
          set -euo pipefail
          node scripts/check-staging-health.mjs
          node scripts/probe-staging-login.mjs
          YM3_PROBE_LEGACY=1 node scripts/probe-staging-login.mjs
          node scripts/probe-staging-mt5-conflict.mjs
          node scripts/verify-mt5-conflict-schema.mjs
      - name: Document release boundaries and evidence
        if: always()
        shell: bash
        run: |
          echo "Staging conflict recovery source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Only isolated ym-fx-staging Worker and additive staging D1 schema 0018 were targeted; production untouched." >> "$GITHUB_STEP_SUMMARY"
          echo "Unreviewed conflicting broker candidates are kept separately and originals remain immutable." >> "$GITHUB_STEP_SUMMARY"
          echo "Real broker capture must be verified on the user's paired Windows PC. No trading execution was enabled." >> "$GITHUB_STEP_SUMMARY"
