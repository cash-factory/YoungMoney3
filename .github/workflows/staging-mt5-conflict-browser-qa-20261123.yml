name: One-off staging browser acceptance for MT5 evidence review
on:
  push:
    branches: [fix/mt5-evidence-conflict-quarantine-20261123]
    paths: [.github/workflows/staging-mt5-conflict-browser-qa-20261123.yml]
permissions:
  contents: read
jobs:
  review-ui:
    if: github.repository == 'cash-factory/YoungMoney3'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      YM3_STAGING_D1_ID: ${{ vars.YM3_STAGING_D1_ID }}
      YM3_STAGING_D1_NAME: ${{ vars.YM3_STAGING_D1_NAME }}
      YM3_STAGING_WORKER_NAME: ${{ vars.YM3_STAGING_WORKER_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm isolated staging database and existing conflict-review migration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/mt5-evidence-conflict-quarantine-20261123'
          test "${YM3_STAGING_WORKER_NAME:-}" = 'ym-fx-staging'
          npm ci
          npm run cf:staging:prepare
          npm run cf:staging:verify
          node scripts/verify-mt5-conflict-schema.mjs
      - name: Test actual staging MT5 account review and clean all disposable data
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          YM3_PROBE_BROWSER=1 node scripts/probe-staging-mt5-conflict.mjs
