name: Inspect staging MT5 connector download response
on:
  push:
    branches: [fix/mt5-namedtuple-capture-20261123]
    paths: [.github/workflows/inspect-staging-download-20261123.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public staging asset without logging credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://ym-fx-staging.ethical-hacker263.workers.dev';
          for(const path of ['/connector-download.html','/connector-download.html?hotfix=20261123','/api/health']){
            const response=await fetch(base+path,{signal:AbortSignal.timeout(15000)});
            const body=await response.text();
            console.log(JSON.stringify({
              path,status:response.status,finalPath:new URL(response.url).pathname,
              contentType:response.headers.get('content-type'),
              length:body.length,updatedVersion:body.includes('staging-connector-v0.5.5-rc1'),
              previousVersion:body.includes('staging-connector-v0.5.4-rc1'),
              isDownloadPage:body.includes('id="download"'),
              isSPA:body.includes('<div id="root"'),
              title:(body.match(/<title>([^<]*)<\/title>/)||[])[1]||null
            }));
            if(!response.ok || (path.startsWith('/connector-') && !body.includes('staging-connector-v0.5.5-rc1')))process.exitCode=1;
          }
          NODE
