name: One-off v0.5.7 MT5 offline recovery staging prerelease
on:
  push:
    branches: [fix/mt5-reconnect-recovery-20261123]
    paths: [.github/workflows/staging-mt5-recovery-connector-release-20261123.yml]
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
env:
  VERSION: '0.5.7-rc1'
  SOURCE_SHA: ${{ github.sha }}
concurrency:
  group: youngmoney3-staging-mt5-recovery-connector-20261123
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'cash-factory/YoungMoney3' && github.ref == 'refs/heads/fix/mt5-reconnect-recovery-20261123'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Confirm exact stage-verified source and unused tag
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/fix/mt5-reconnect-recovery-20261123" --jq '.object.sha')"
          if [[ "$latest" != "$SOURCE_SHA" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit superseded this release candidate.'
            exit 0
          fi
          declared="$(python -c "import sys;sys.path.insert(0,'connector');from version import VERSION;print(VERSION)")"
          if [[ "$declared" != "$VERSION" ]]; then
            echo "Source version $declared does not match release version $VERSION"
            exit 1
          fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq "staging-connector-v$VERSION" <<< "$releases"; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'An immutable release already exists; not rebuilding it.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  connector:
    needs: candidate
    if: needs.candidate.outputs.ready == 'true'
    runs-on: windows-2022
    environment: staging
    timeout-minutes: 35
    steps:
      - name: Validate staging version before building
        run: |
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$') { throw 'Invalid staging prerelease version' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Require current staging recovery branch and matching version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -ne (git rev-parse HEAD)) { throw 'Source checkout differs from validated commit' }
          $lines = git ls-remote "https://github.com/$env:GITHUB_REPOSITORY.git" 'refs/heads/fix/mt5-reconnect-recovery-20261123'
          if ($LASTEXITCODE -ne 0 -or !$lines) { throw 'Unable to verify current main' }
          $remote = (($lines | Select-Object -First 1) -split '\s+')[0]
          if ($remote -ne $env:SOURCE_SHA) { throw 'Staging recovery branch moved; refusing stale connector prerelease' }
          $declared = (python -c "import sys;sys.path.insert(0,'connector');from version import VERSION;print(VERSION)").Trim()
          if ($declared -ne $env:VERSION) { throw 'Desktop version differs from immutable release tag' }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r connector/requirements.txt 'pyinstaller==6.16.0'
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          python -m pip freeze | Out-File -Encoding utf8 connector-dependencies.txt
      - name: Test on Windows
        shell: pwsh
        run: |
          python -m py_compile connector/connect.py connector/lifecycle.py connector/connector_gui.py connector/studio_ui.py connector/sessions.py connector/terminal_factory.py connector/concurrent_capture.py connector/pc_identity.py connector/cash_history.py
          if ($LASTEXITCODE -ne 0) { throw 'Compile check failed' }
          python -m unittest discover -s connector -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Connector tests failed' }
      - name: Build standalone staging application
        shell: pwsh
        run: |
          python connector/build_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Executable build or archive inspection failed' }
      - name: Generate prerelease checksum
        shell: pwsh
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$') { throw 'Use 0.5.4-rc1 format' }
          New-Item -ItemType Directory -Force staging-release | Out-Null
          Copy-Item 'dist/YoungMoney3 Connector.exe' 'staging-release/YoungMoney3.Connector.exe'
          $digest=(Get-FileHash 'staging-release/YoungMoney3.Connector.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest *YoungMoney3.Connector.exe" | Set-Content -Encoding ascii 'staging-release/YoungMoney3.Connector.exe.sha256'
          Copy-Item connector-dependencies.txt staging-release/connector-dependencies.txt
          $manifest = @{version=$env:VERSION;commit=$env:SOURCE_SHA;sha256=$digest;signed=$false;platform='windows-x64';environment='staging'} | ConvertTo-Json -Compress
          $manifest | Set-Content -Encoding utf8 'staging-release/build-manifest.json'
      - uses: actions/upload-artifact@v4
        with:
          name: youngmoney3-connector-staging-${{ env.VERSION }}
          path: staging-release/*
          if-no-files-found: error
          retention-days: 30

  startup-smoke:
    needs: connector
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      # Separate VM: no checkout, setup-python or pip installation.
      - uses: actions/download-artifact@v4
        with:
          name: youngmoney3-connector-staging-${{ env.VERSION }}
          path: ${{ runner.temp }}/connector-clean
      - name: Launch standalone executable in isolated profile
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'connector-clean'
          $exe = Join-Path $dir 'YoungMoney3.Connector.exe'
          $expected = ((Get-Content (Join-Path $dir 'YoungMoney3.Connector.exe.sha256') -Raw) -split ' ')[0]
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Checksum mismatch' }
          $profile = Join-Path $dir 'clean-profile'
          New-Item -ItemType Directory -Force $profile | Out-Null
          $env:LOCALAPPDATA = $profile
          $env:APPDATA = $profile
          $env:USERPROFILE = $profile
          $env:HOME = $profile
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          'TCL_LIBRARY','TK_LIBRARY','TCLLIBPATH','PYTHONHOME','PYTHONPATH','VIRTUAL_ENV' | ForEach-Object { Remove-Item "Env:$_" -ErrorAction SilentlyContinue }
          foreach ($attempt in 1..2) {
            $report = Join-Path $dir "startup-$attempt.json"
            $process = Start-Process -FilePath $exe -ArgumentList @('--startup-smoke', ('"' + $report + '"')) -WorkingDirectory $dir -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(45000)) {
              taskkill /PID $process.Id /T /F
              Get-Content "$report.log" -ErrorAction SilentlyContinue
              throw 'Standalone startup timed out (possible runtime error dialog)'
            }
            Get-Content "$report.log" -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Standalone startup failed' }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if ($result.startup -ne 'ok' -or !$result.frozen -or !$result.tcl_bundled -or !$result.tk_bundled -or $result.capture_started -or !$result.session_manager -or !$result.pairing_controls -or !$result.activity_view -or !$result.terminal_creation -or !$result.responsive_layout -or !$result.motion_controls -or !$result.native_artwork) { throw 'Standalone startup evidence invalid' }
            Get-Content $report
          }
          # Verify the compiled one-file EXE can spawn two *independent* MT5
          # workers in a clean profile. This does not log in or capture trades.
          $parallel = Join-Path $dir 'parallel-processes.json'
          $childTest = Start-Process -FilePath $exe -ArgumentList @('--parallel-smoke', ('"' + $parallel + '"')) -WorkingDirectory $dir -WindowStyle Hidden -PassThru
          if (!$childTest.WaitForExit(120000)) {
            taskkill /PID $childTest.Id /T /F
            Get-Content "$parallel.log" -ErrorAction SilentlyContinue
            throw 'Two-process capture bootstrap timed out'
          }
          if ($childTest.ExitCode -ne 0 -or !(Test-Path $parallel)) {
            Get-Content "$parallel.log" -ErrorAction SilentlyContinue
            throw 'Two-process capture bootstrap failed'
          }
          $parallelResult = Get-Content $parallel -Raw | ConvertFrom-Json
          if ($parallelResult.parallel_spawn -ne 'ok' -or $parallelResult.distinct_processes -ne 2 -or $parallelResult.broker_capture_started) {
            throw 'Frozen two-process capture evidence invalid'
          }
          Get-Content $parallel
          if (Test-Path (Join-Path $profile 'YMFX')) { throw 'Smoke test modified connector state' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-startup-evidence-${{ env.VERSION }}
          path: ${{ runner.temp }}/connector-clean/startup-*
          if-no-files-found: error

  publish:
    needs: [connector, startup-smoke]
    runs-on: windows-2022
    environment: staging
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: youngmoney3-connector-staging-${{ env.VERSION }}
          path: staging-release
      - name: Require successful verified staging source and no code drift
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $job = gh api "repos/$env:GH_REPO/actions/runs/45170063911" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $job.conclusion -ne 'success' -or $job.head_sha -ne 'df157fc1b0ae4c4823dd1421833ab54045fb19c1') { throw 'Verified staging release must pass for the exact original source.' }
          $diff = gh api "repos/$env:GH_REPO/compare/df157fc1b0ae4c4823dd1421833ab54045fb19c1...$env:SOURCE_SHA" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $diff.ahead_by -ne 1 -or $diff.behind_by -ne 0) { throw 'Unexpected source drift since staging verification.' }
          $changed = @($diff.files | ForEach-Object { $_.filename })
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/staging-mt5-recovery-connector-release-20261123.yml') { throw 'Unverified application changes found after staged acceptance.' }
          $health = Invoke-RestMethod -Uri 'https://ym-fx-staging.ethical-hacker263.workers.dev/api/health' -Method Get -TimeoutSec 20
          if ($health.status -ne 'ok' -or $health.database -ne 'connected') { throw 'Isolated staging Worker unavailable.' }
      - name: Publish new immutable staging prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$') { throw 'Invalid staging version' }
          $tag = 'staging-connector-v' + $env:VERSION
          # List successfully before checking absence; API/auth failure must stop publication.
          $releases = gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing releases' }
          if ($releases -contains $tag) { throw "Release $tag already exists; refusing overwrite" }
          $tags = gh api --paginate "repos/$env:GH_REPO/git/matching-refs/tags/staging-connector-v" --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing tags' }
          if ($tags -contains "refs/tags/$tag") { throw "Tag $tag already exists; refusing reuse" }
          $latest = gh api "repos/$env:GH_REPO/git/ref/heads/fix/mt5-reconnect-recovery-20261123" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $latest -ne $env:SOURCE_SHA) { throw 'Staging recovery branch moved during build; refusing stale release' }
          $manifest = Get-Content staging-release/build-manifest.json -Raw | ConvertFrom-Json
          $digest = (Get-FileHash 'staging-release/YoungMoney3.Connector.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.commit -ne $env:SOURCE_SHA -or $manifest.version -ne $env:VERSION -or $manifest.sha256 -ne $digest -or $manifest.environment -ne 'staging') { throw 'Release provenance mismatch' }
          gh release create $tag 'staging-release/YoungMoney3.Connector.exe' 'staging-release/YoungMoney3.Connector.exe.sha256' 'staging-release/build-manifest.json' 'staging-release/connector-dependencies.txt' --target $env:SOURCE_SHA --title "YoungMoney3 Connector $env:VERSION (STAGING)" --notes "YoungMoney3 v0.5.7-rc1 staging offline-recovery build tested against the isolated staging Worker. Read-only broker-account capture, verified offline close reconstruction for seven trades, position-scoped specification snapshots, durable outbox and strict no-order-execution isolation. Clean Windows frozen-app startup and two-process smoke tested; real broker acceptance not yet verified. Unsigned Windows x64; verify SHA-256 before opening. Demo/contest accounts only." --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Prerelease publication failed' }
