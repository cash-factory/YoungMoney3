name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile connector/connect.py connector/ledger.py
      - run: python -m unittest discover -s connector -p 'test_ledger.py'
      - run: python scripts/test-connector-archive.py
      - run: npm run build

  mt5-terminal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r connector/requirements.txt
      - run: python -m unittest discover -s connector -p 'test_*.py'
