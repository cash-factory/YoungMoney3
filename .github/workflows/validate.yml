name: Validate
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: youngmoney3-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/audit-classic-public-releases.test.mjs
      - run: npm run test:staging
      - run: node --test scripts/test-owner-recovery.mjs
      - run: npm run test:ui
      - run: npm run test:worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile connector/connect.py connector/ledger.py
      - run: python -m unittest discover -s connector -p 'test_ledger.py'
      - run: python -m unittest discover -s scripts -p 'test_verify_mt5_evidence_snapshot.py' -v
      - run: python scripts/test-connector-archive.py
      - run: python scripts/test-connector-release-contract.py
      - run: npm run build
      - run: python scripts/test-connector-archive.py --check-dist
      - name: Browser-check responsive command centre
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/ymfx-command-preview.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-command-palette-browser.mjs
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-decisions-browser.mjs
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-improvement-lab-browser.mjs
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-adaptive-patterns-browser.mjs
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-adaptive-themes-browser.mjs
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-attention-hierarchy-browser.mjs
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-shared-ui-browser.mjs
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-connector-download-browser.mjs
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-mt5-onboarding-browser.mjs
      - name: Attach screenshots for interface review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-desk-visual-review
          path: artifacts/adaptive/
          retention-days: 7

  mt5-terminal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r connector/requirements.txt
      - run: python -m unittest discover -s connector -p 'test_*.py'
