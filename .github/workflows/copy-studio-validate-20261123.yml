name: Validate Copy Studio draft on stacked feature branch
on:
  push:
    branches: [feature/copy-studio-demo-control-plane-20261123]
    paths: [.github/workflows/copy-studio-validate-20261123.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compile, lint and execute Worker+D1 Copy Studio contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run test:staging
          node --test scripts/test-owner-recovery.mjs
          npm run test:ui
          npm run test:worker
          npm run build
      - name: Browser-check responsive workspace navigation
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/copy-preview.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-command-palette-browser.mjs
          YM3_PREVIEW_URL=http://127.0.0.1:4173/ node scripts/test-shared-ui-browser.mjs
  windows-connector:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r connector/requirements.txt
      - run: python -m unittest discover -s connector -p 'test_*.py'
