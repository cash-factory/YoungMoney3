name: Landing page visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/LandingPage.tsx'
      - 'src/components/LandingIcon.tsx'
      - 'src/*.css'
      - 'src/context/ThemeContext.ts'
      - 'scripts/test-landing-icons-browser.mjs'
      - 'scripts/test-workflow-ribbon-browser.mjs'
      - '.github/workflows/landing-theme-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-theme-icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the revision under review
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate and build homepage
        run: |
          npm run test:ui
          npm run build
      - name: Install Chromium for the locked Playwright version
        run: npx playwright install --with-deps chromium
      - name: Check 12 palettes in both modes at 4 responsive sizes
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/ym3-preview.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null || { cat "$RUNNER_TEMP/ym3-preview.log"; exit 1; }
          export YM3_PREVIEW_URL=http://127.0.0.1:4173/
          node scripts/test-landing-icons-browser.mjs
          node scripts/test-workflow-ribbon-browser.mjs
      - name: Preserve feature-card screenshots for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-icon-palettes-${{ github.sha }}
          path: |
            artifacts/landing-icons/
            artifacts/workflow-ribbon/
          if-no-files-found: warn
          retention-days: 7
