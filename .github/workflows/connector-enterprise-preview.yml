name: Connector Enterprise V1 Windows Visual QA

on:
  pull_request:
    paths:
      - 'connector/**'
      - '.github/workflows/connector-enterprise-preview.yml'
  push:
    branches: [main]
    paths:
      - 'connector/**'
      - '.github/workflows/connector-enterprise-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r connector/requirements.txt Pillow
      - name: Verify connector tests and UI tokens
        run: python -m unittest discover -s connector -p 'test_*.py' -v
      - name: Render actual Windows connector screens
        run: python connector/render_enterprise_preview.py "${{ runner.temp }}/enterprise-screens"
      - uses: actions/upload-artifact@v4
        with:
          name: connector-enterprise-v1-screens
          path: ${{ runner.temp }}/enterprise-screens/*.png
          if-no-files-found: error
          retention-days: 14
