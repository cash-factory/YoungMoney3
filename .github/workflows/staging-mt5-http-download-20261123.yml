name: One-off staging MT5 connector hotfix download update
# Source checksum and UI contract retested against official v0.5.6-rc1 diagnostic prerelease.
on:
  push:
    branches: [fix/mt5-http-capture-diagnostics-20261123]
    paths: [.github/workflows/staging-mt5-http-download-20261123.yml]

permissions:
  contents: read

concurrency:
  group: youngmoney3-staging-release
  cancel-in-progress: false

jobs:
  staging:
    if: github.repository == 'cash-factory/YoungMoney3'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 32
    env:
      YM3_STAGING_D1_ID: ${{ vars.YM3_STAGING_D1_ID }}
      YM3_STAGING_D1_NAME: ${{ vars.YM3_STAGING_D1_NAME }}
      YM3_STAGING_WORKER_NAME: ${{ vars.YM3_STAGING_WORKER_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse production, unexpected branch, missing prerelease or unrelated changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/mt5-http-capture-diagnostics-20261123'
          test "${YM3_STAGING_WORKER_NAME:-}" = 'ym-fx-staging'
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = '17bdb47afb76db41c1166d064b517cff2a812019'
          test "$(git merge-base origin/fix/mt5-namedtuple-capture-20261123 HEAD)" = 'ac31d5ae3b0e2cffc4d9eb437c87680a0bc3ddb2'
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/connector-prerelease.yml|.github/workflows/staging-mt5-http-download-20261123.yml|.github/workflows/staging-http-diagnostics-release-20261123.yml|connector/README.md|connector/concurrent_capture.py|connector/connect.py|connector/test_cash_history.py|connector/test_concurrent_capture.py|connector/test_history_scan.py|connector/test_http_transport.py|connector/test_managed_accounts.py|connector/version.py|public/connector-download.html|scripts/test-connector-release-contract.py|scripts/test-ui-contract.mjs|src/components/Mt5Connections.tsx) ;;
              *) echo "Unapproved diagnostic update path: $path"; exit 1;;
            esac
          done < <(git diff --name-only origin/fix/mt5-namedtuple-capture-20261123...HEAD)
          details="$(gh api repos/$GITHUB_REPOSITORY/releases/tags/staging-connector-v0.5.6-rc1 --jq '.prerelease')"
          test "$details" = 'true'
          digest="$(gh api repos/$GITHUB_REPOSITORY/releases/tags/staging-connector-v0.5.6-rc1 --jq '.assets[]|select(.name=="YoungMoney3.Connector.exe")|.digest')"
          test "$digest" = 'sha256:5921d93c6dc7be8486ca10989887f5c69f324512f34fe2e771659b2d3227470c'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify source and built website
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run test:staging
          node --test scripts/test-owner-recovery.mjs
          npm run test:ui
          npm run test:worker
          python scripts/test-connector-release-contract.py
          npm run build
          python scripts/test-connector-archive.py --check-dist
      - name: Validate existing separate staging database and do not migrate
        shell: bash
        run: |
          set -euo pipefail
          npm run cf:staging:prepare
          npm run cf:staging:verify
          node scripts/verify-rich-staging-schema.mjs
          node scripts/verify-copy-staging-schema.mjs
      - name: Deploy only staging website and Worker, without database migrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = '17bdb47afb76db41c1166d064b517cff2a812019'
          npx wrangler deploy --config wrangler.staging.jsonc --dry-run
          npx wrangler deploy --config wrangler.staging.jsonc | tee "$RUNNER_TEMP/mt5-hotfix-site.log"
          grep -F 'https://ym-fx-staging.ethical-hacker263.workers.dev' "$RUNNER_TEMP/mt5-hotfix-site.log"
      - name: Check staging health, credentials and published-download links
        shell: bash
        env:
          YM3_STAGING_URL: https://ym-fx-staging.ethical-hacker263.workers.dev
        run: |
          set -euo pipefail
          node scripts/check-staging-health.mjs
          node scripts/probe-staging-login.mjs
          YM3_PROBE_LEGACY=1 node scripts/probe-staging-login.mjs
          curl --location --fail --silent --show-error --max-time 20 "$YM3_STAGING_URL/connector-download.html" | grep -F 'staging-connector-v0.5.6-rc1'
      - name: Release evidence
        if: always()
        shell: bash
        run: |
          echo "Staging MT5 connector download hotfix: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Only ym-fx-staging was targeted; D1 migrations were not run." >> "$GITHUB_STEP_SUMMARY"
          echo "The published prerelease remains read-only. Real broker IPC on the user's Windows PC is not covered by CI." >> "$GITHUB_STEP_SUMMARY"
